name: QA Observatory

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Production QA scenario to run
        required: true
        default: KQA-UX-001
        type: choice
        options:
          - KQA-UX-001
      viewport:
        description: Browser viewports to record
        required: true
        default: both
        type: choice
        options:
          - both
          - desktop
          - mobile

  issue_comment:
    types:
      - created

permissions:
  contents: write
  id-token: write
  issues: write

env:
  PLAYWRIGHT_BASE_URL: https://www.khonsera.com
  NEXT_TELEMETRY_DISABLED: 1
  OBSERVATORY_SCENARIO: ${{ inputs.scenario || 'KQA-UX-001' }}
  OBSERVATORY_VIEWPORT: ${{ inputs.viewport || 'both' }}
  QA_AUTH_FUNCTION_URL: https://attbfwemjoslugvtfbrt.supabase.co/functions/v1/qa-observer-auth
  KQA_SUPABASE_URL: https://attbfwemjoslugvtfbrt.supabase.co
  KQA_SUPABASE_PUBLISHABLE_KEY: sb_publishable_qGQTlzrEcNjV33Ia2hwPmA_GZE22stL
  KQA_MODEL: gpt-5.6-sol

jobs:
  observe:
    name: Record production traveller
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 90 &&
        github.event.comment.author_association == 'OWNER' &&
        startsWith(github.event.comment.body, 'QA:UX KQA-UX-001')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Record adaptive KQA-UX-001
        id: traveller
        continue-on-error: true
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          KQA_RUN_NUMBER: ${{ github.run_number }}
          OBSERVER_VIEWPORT: ${{ env.OBSERVATORY_VIEWPORT }}
        run: |
          set -u -o pipefail

          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::OPENAI_API_KEY repository secret is required for adaptive QA:UX computer use."
            exit 78
          fi

          oidc_json="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=khonsera-qa-observer")"

          oidc_token="$(jq -r '.value // empty' <<<"$oidc_json")"
          test -n "$oidc_token"

          mint_link() {
            curl --fail --silent --show-error \
              -X POST \
              -H "Authorization: Bearer $oidc_token" \
              "$QA_AUTH_FUNCTION_URL"
          }

          run_viewport() {
            local project="$1"
            local auth_json qa_email link

            auth_json="$(mint_link)" || return 1
            qa_email="$(jq -r '.email // empty' <<<"$auth_json")"
            link="$(jq -r '.action_link // empty' <<<"$auth_json")"

            test -n "$qa_email" || return 1
            test -n "$link" || return 1

            echo "::add-mask::$link"

            KHONSERA_QA_EMAIL="$qa_email" \
            KHONSERA_QA_MAGIC_LINK="$link" \
            KQA_VIEWPORT="$project" \
            KQA_EVIDENCE_DIR="test-results/adaptive/$project" \
            KQA_MAX_TURNS="40" \
            KQA_MAX_MINUTES="12" \
            KQA_MAX_ACTIONS="140" \
              npm run qa:adaptive
          }

          status=0

          case "$OBSERVER_VIEWPORT" in
            desktop)
              run_viewport desktop-chromium || status=1
              ;;
            mobile)
              run_viewport mobile-390 || status=1
              ;;
            both)
              run_viewport desktop-chromium || status=1
              run_viewport mobile-390 || status=1
              ;;
            *)
              echo "Unsupported viewport: $OBSERVER_VIEWPORT" >&2
              exit 2
              ;;
          esac

          exit "$status"

      - name: Prepare adaptive browser evidence
        if: always()
        shell: bash
        env:
          RUN_SCENARIO: ${{ env.OBSERVATORY_SCENARIO }}
          OBSERVER_VIEWPORT: ${{ env.OBSERVATORY_VIEWPORT }}
        run: |
          set -euo pipefail
          mkdir -p qa-publish

          outcome_for() {
            local project="$1"
            local result="test-results/adaptive/$project/result.json"
            if [ -f "$result" ]; then
              jq -r '.pilot.outcome // "unknown"' "$result"
            else
              echo "not-run"
            fi
          }

          for project in desktop-chromium mobile-390; do
            root="test-results/adaptive/$project"

            [ -f "$root/$project.webm" ] && cp "$root/$project.webm" "qa-publish/$project.webm"
            [ -f "$root/$project-trace.zip" ] && cp "$root/$project-trace.zip" "qa-publish/$project-trace.zip"
            [ -f "$root/result.json" ] && cp "$root/result.json" "qa-publish/$project-pilot.json"
            [ -f "$root/actions.jsonl" ] && cp "$root/actions.jsonl" "qa-publish/$project-actions.jsonl"
            [ -f "$root/$project-start.png" ] && cp "$root/$project-start.png" "qa-publish/$project-start.png"
            [ -f "$root/$project-final.png" ] && cp "$root/$project-final.png" "qa-publish/$project-final.png"
          done

          desktop_outcome="$(outcome_for desktop-chromium)"
          mobile_outcome="$(outcome_for mobile-390)"

          jq -n \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runNumber "$GITHUB_RUN_NUMBER" \
            --arg scenario "$RUN_SCENARIO" \
            --arg viewport "$OBSERVER_VIEWPORT" \
            --arg sha "$GITHUB_SHA" \
            --arg infrastructureOutcome "${{ steps.traveller.outcome }}" \
            --arg desktopOutcome "$desktop_outcome" \
            --arg mobileOutcome "$mobile_outcome" \
            --arg environment "production" \
            --arg targetUrl "https://www.khonsera.com" \
            --arg executionMode "adaptive-computer-use" \
            --arg dataBoundary "Persistent dedicated QA traveller in live Supabase; no real passenger data." \
            '{
              runId: $runId,
              runNumber: $runNumber,
              scenario: $scenario,
              viewport: $viewport,
              sha: $sha,
              infrastructureOutcome: $infrastructureOutcome,
              pilotOutcomes: {
                desktop: $desktopOutcome,
                mobile: $mobileOutcome
              },
              executionMode: $executionMode,
              environment: $environment,
              targetUrl: $targetUrl,
              dataBoundary: $dataBoundary
            }' > qa-publish/manifest.json

      - name: Upload workflow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-observer-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            qa-publish/
            test-results/adaptive/

      - name: Publish adaptive browser-viewable evidence
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SCENARIO: ${{ env.OBSERVATORY_SCENARIO }}
          OBSERVER_VIEWPORT: ${{ env.OBSERVATORY_VIEWPORT }}
          INFRASTRUCTURE_OUTCOME: ${{ steps.traveller.outcome }}
        run: |
          set -euo pipefail
          tag="qa-observer-${GITHUB_RUN_ID}"
          notes="$(mktemp)"

          cat > "$notes" <<EOF
          Production Khonsera traveller evidence.

          - Scenario: ${RUN_SCENARIO}
          - Workflow run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Commit: ${GITHUB_SHA}
          - Target: https://www.khonsera.com
          - Viewport: ${OBSERVER_VIEWPORT}
          - Execution: adaptive computer-use pilot (screen observation → action → re-observation)
          - Infrastructure outcome: ${INFRASTRUCTURE_OUTCOME}
          - Desktop pilot outcome: $(jq -r '.pilot.outcome // "not-run"' test-results/adaptive/desktop-chromium/result.json 2>/dev/null || echo not-run)
          - Mobile pilot outcome: $(jq -r '.pilot.outcome // "not-run"' test-results/adaptive/mobile-390/result.json 2>/dev/null || echo not-run)
          - Data boundary: persistent dedicated QA traveller in live Supabase; no real passenger data.
          - Cleanup policy: preserve QA-created data unless a specific retest requires selective cleanup.
          EOF

          gh release create "$tag" qa-publish/*             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title "${RUN_SCENARIO} · Production Observer #$GITHUB_RUN_NUMBER"             --notes-file "$notes"             --prerelease

      - name: Publish adaptive findings to GitHub
        if: always() && steps.traveller.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/qa/publish-findings.mjs

      - name: Preserve adaptive pilot infrastructure failure
        if: steps.traveller.outcome == 'failure'
        run: |
          echo "Adaptive QA evidence was preserved where possible, but the pilot infrastructure failed." >&2
          exit 1
