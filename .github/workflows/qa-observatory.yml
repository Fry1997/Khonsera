name: QA Observatory

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Production QA scenario to run
        required: true
        default: KQA-UX-001
        type: choice
        options:
          - KQA-UX-001
      viewport:
        description: Browser viewports to record
        required: true
        default: both
        type: choice
        options:
          - both
          - desktop
          - mobile

  issue_comment:
    types:
      - created

permissions:
  contents: write
  id-token: write
  issues: read

env:
  PLAYWRIGHT_BASE_URL: https://www.khonsera.com
  NEXT_TELEMETRY_DISABLED: 1
  OBSERVATORY_SCENARIO: ${{ inputs.scenario || 'KQA-UX-001' }}
  OBSERVATORY_VIEWPORT: ${{ inputs.viewport || 'both' }}
  QA_AUTH_FUNCTION_URL: https://attbfwemjoslugvtfbrt.supabase.co/functions/v1/qa-observer-auth

jobs:
  observe:
    name: Record production traveller
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 90 &&
        github.event.comment.author_association == 'OWNER' &&
        startsWith(github.event.comment.body, 'QA:UX KQA-UX-001')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Mint production QA login
        shell: bash
        run: |
          set -euo pipefail

          oidc_json="$(curl --fail --silent --show-error             -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=khonsera-qa-observer")"

          oidc_token="$(jq -r '.value // empty' <<<"$oidc_json")"
          test -n "$oidc_token"

          auth_json="$(curl --fail --silent --show-error             -X POST             -H "Authorization: Bearer $oidc_token"             "$QA_AUTH_FUNCTION_URL")"

          qa_email="$(jq -r '.email // empty' <<<"$auth_json")"
          magic_link="$(jq -r '.action_link // empty' <<<"$auth_json")"

          test -n "$qa_email"
          test -n "$magic_link"

          echo "::add-mask::$magic_link"
          {
            echo "KHONSERA_QA_EMAIL=$qa_email"
            echo "KHONSERA_QA_MAGIC_LINK=$magic_link"
          } >> "$GITHUB_ENV"

      - name: Record KQA-UX-001
        id: traveller
        continue-on-error: true
        shell: bash
        env:
          PLAYWRIGHT_OBSERVER: "1"
          KQA_PRODUCTION: "1"
          KQA_RUN_NUMBER: ${{ github.run_number }}
          OBSERVER_VIEWPORT: ${{ env.OBSERVATORY_VIEWPORT }}
        run: |
          set -euo pipefail
          project_args=()

          case "$OBSERVER_VIEWPORT" in
            desktop)
              project_args+=(--project=desktop-chromium)
              ;;
            mobile)
              project_args+=(--project=mobile-390)
              ;;
            both)
              ;;
            *)
              echo "Unsupported viewport: $OBSERVER_VIEWPORT" >&2
              exit 2
              ;;
          esac

          case "$OBSERVATORY_SCENARIO" in
            KQA-UX-001)
              npx playwright test tests/e2e/kqa-ux-001.spec.ts                 --workers=1                 "${project_args[@]}"
              ;;
            *)
              echo "Unsupported scenario: $OBSERVATORY_SCENARIO" >&2
              exit 2
              ;;
          esac

      - name: Prepare browser evidence
        if: always()
        shell: bash
        env:
          RUN_SCENARIO: ${{ env.OBSERVATORY_SCENARIO }}
          OBSERVER_VIEWPORT: ${{ env.OBSERVATORY_VIEWPORT }}
        run: |
          set -euo pipefail
          mkdir -p qa-publish

          for project in desktop-chromium mobile-390; do
            video="$(find test-results -type f -path "*${project}*" -name 'video.webm' 2>/dev/null | head -n 1 || true)"
            trace="$(find test-results -type f -path "*${project}*" -name 'trace.zip' 2>/dev/null | head -n 1 || true)"

            if [ -n "$video" ]; then
              cp "$video" "qa-publish/${project}.webm"
            fi

            if [ -n "$trace" ]; then
              cp "$trace" "qa-publish/${project}-trace.zip"
            fi

            if [ -f "test-results/traveller-audit/${project}.json" ]; then
              cp "test-results/traveller-audit/${project}.json"                 "qa-publish/${project}-metrics.json"
            fi

            if compgen -G "test-results/visual-evidence/${project}-*.png" > /dev/null; then
              cp test-results/visual-evidence/${project}-*.png qa-publish/
            fi
          done

          if [ -d playwright-report ]; then
            zip -qr qa-publish/playwright-report.zip playwright-report
          fi

          jq -n             --arg runId "$GITHUB_RUN_ID"             --arg runNumber "$GITHUB_RUN_NUMBER"             --arg scenario "$RUN_SCENARIO"             --arg viewport "$OBSERVER_VIEWPORT"             --arg sha "$GITHUB_SHA"             --arg outcome "${{ steps.traveller.outcome }}"             --arg environment "production"             --arg targetUrl "https://www.khonsera.com"             --arg dataBoundary "Persistent dedicated QA traveller in live Supabase; no real passenger data."             '{
              runId: $runId,
              runNumber: $runNumber,
              scenario: $scenario,
              viewport: $viewport,
              sha: $sha,
              outcome: $outcome,
              environment: $environment,
              targetUrl: $targetUrl,
              dataBoundary: $dataBoundary
            }' > qa-publish/manifest.json

      - name: Upload workflow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-observer-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            qa-publish/
            playwright-report/
            test-results/

      - name: Publish browser-viewable evidence
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SCENARIO: ${{ env.OBSERVATORY_SCENARIO }}
          OBSERVER_VIEWPORT: ${{ env.OBSERVATORY_VIEWPORT }}
          TRAVELLER_OUTCOME: ${{ steps.traveller.outcome }}
        run: |
          set -euo pipefail
          tag="qa-observer-${GITHUB_RUN_ID}"
          notes="$(mktemp)"

          cat > "$notes" <<EOF
          Production Khonsera traveller evidence.

          - Scenario: ${RUN_SCENARIO}
          - Workflow run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Commit: ${GITHUB_SHA}
          - Target: https://www.khonsera.com
          - Viewport: ${OBSERVER_VIEWPORT}
          - Playwright outcome: ${TRAVELLER_OUTCOME}
          - Data boundary: persistent dedicated QA traveller in live Supabase; no real passenger data.
          - Cleanup policy: preserve QA-created data unless a specific retest requires selective cleanup.
          EOF

          gh release create "$tag" qa-publish/*             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title "${RUN_SCENARIO} · Production Observer #$GITHUB_RUN_NUMBER"             --notes-file "$notes"             --prerelease

      - name: Preserve traveller failure
        if: steps.traveller.outcome == 'failure'
        run: |
          echo "The production observer evidence was published, but the traveller test failed." >&2
          exit 1
