name: QA Observatory Pages

on:
  push:
    branches:
      - claude/khonsera-build-brief-An4oz
    paths:
      - qa-pages/**
      - .github/workflows/qa-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: qa-observatory-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish observer
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload observer
        uses: actions/upload-pages-artifact@v4
        with:
          path: qa-pages

      - name: Deploy observer
        id: deployment
        uses: actions/deploy-pages@v4
