name: Validate

on:
  pull_request:
  push:
    branches:
      - claude/khonsera-build-brief-An4oz
      - chore/astra-observability

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
  NEXT_PUBLIC_APP_ENV: ci
  NEXT_TELEMETRY_DISABLED: 1
  SUPABASE_TELEMETRY_DISABLED: 1

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  browser:
    needs: app
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Start isolated Supabase for authenticated tests
        shell: bash
        run: |
          set -euo pipefail
          npx supabase start
          status_env="$(npx supabase status -o env)"
          eval "$status_env"
          test -n "${ANON_KEY:-}"
          test -n "${SERVICE_ROLE_KEY:-}"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "E2E_SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Production build for browser verification
        run: npm run build

      - name: Playwright smoke, authenticated and accessibility checks
        run: npm run test:e2e

      - name: Lighthouse budgets
        run: npm run lighthouse

      - name: Stop isolated Supabase
        if: always()
        run: npx supabase stop --no-backup || true

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            playwright-report/
            test-results/
            lighthouse-report/
