name: Bootstrap observability dependencies

on:
  push:
    branches:
      - chore/astra-observability
    paths:
      - .github/workflows/bootstrap-observability.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: chore/astra-observability

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Add runtime observability dependencies
        run: npm install @sentry/nextjs posthog-js @vercel/analytics @vercel/speed-insights

      - name: Add browser, accessibility and performance test dependencies
        run: npm install --save-dev @playwright/test @axe-core/playwright @lhci/cli

      - name: Commit generated dependency lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency files already current"
            exit 0
          fi
          git commit -m "chore: add observability and browser test dependencies"
          git push origin HEAD:chore/astra-observability
