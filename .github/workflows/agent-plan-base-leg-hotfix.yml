name: Apply Plan base-leg hotfix

on:
  push:
    branches:
      - agent/travel-day-leave-by-mvp

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[hotfix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/travel-day-leave-by-mvp
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply deterministic source patches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected source block not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # The compact Plan/Today pages pass journeyId/passenger. Route those imports
          # through the already-added compatibility adapters instead of crashing when
          # the strict core finder reads defaultPassenger from undefined.
          for page in [
              "src/app/(app)/plan/[id]/page.tsx",
              "src/app/(app)/today/page.tsx",
          ]:
              replace(
                  page,
                  'import { FlightFinder } from "@/components/plan/flight-finder";',
                  'import { FlightFinder } from "@/components/plan/flight-finder-compat";',
              )
              replace(
                  page,
                  'import { StayFinder } from "@/components/plan/stay-finder";',
                  'import { StayFinder } from "@/components/plan/stay-finder-compat";',
              )

          # A home bookend can be a routing destination without becoming a visible stop.
          replace(
              "src/components/today/spine-model.ts",
              "  pass?: SpinePass | null;\n}",
              "  pass?: SpinePass | null;\n  /** Routing context (for example the home bookend): show its inbound movement, not an anchor card. */\n  contextOnly?: boolean;\n}",
          )

          # Keep self-navigated movement cards visible even though Navigate buttons are
          # intentionally absent. Also suppress the destination anchor for context-only
          # home bookends.
          replace(
              "src/components/today/today-spine.tsx",
              'import { londonClock, navigateHref, roleLabel } from "./spine-model";',
              'import { londonClock, roleLabel } from "./spine-model";',
          )
          replace(
              "src/components/today/today-spine.tsx",
              '  const showMovement = anchor.plannedTravelMinutes != null && !!navigateHref(anchor) && state !== "past";',
              '  const selfNavigated = ["walk", "drive", "car", "cycle", "bike", "bicycle"].includes(anchor.travelMode ?? "");\n  const showMovement = anchor.plannedTravelMinutes != null && selfNavigated;',
          )
          replace(
              "src/components/today/today-spine.tsx",
              '''      {anchor.role === "changeover" ? (
        <ChangeCard anchor={anchor} state={state} />
      ) : isAppointment ? (
        <AppointmentCard anchor={anchor} state={state} />
      ) : (
        <AnchorCard anchor={anchor} state={state} />
      )}
      {anchor.pass ? <PassCard pass={anchor.pass} state={state} onShowTicket={onShowTicket} /> : null}''',
              '''      {anchor.contextOnly ? null : anchor.role === "changeover" ? (
        <ChangeCard anchor={anchor} state={state} />
      ) : isAppointment ? (
        <AppointmentCard anchor={anchor} state={state} />
      ) : (
        <AnchorCard anchor={anchor} state={state} />
      )}
      {!anchor.contextOnly && anchor.pass ? <PassCard pass={anchor.pass} state={state} onShowTicket={onShowTicket} /> : null}''',
          )

          # Today keeps start/end out of visible stops, but includes the end bookend as a
          # context-only destination so the station-to-home movement still exists.
          replace(
              "src/app/(app)/today/page.tsx",
              "  const allStops: StopRow[] = [];\n",
              "  const allStops: StopRow[] = [];\n  const contextStops: StopRow[] = [];\n",
          )
          replace(
              "src/app/(app)/today/page.tsx",
              '''      if (st.type !== "start" && st.type !== "end" && isToday(st.start_time, today)) {
        allStops.push({ ...st, mode: evMode });
      }''',
              '''      if (st.type !== "start" && st.type !== "end" && isToday(st.start_time, today)) {
        allStops.push({ ...st, mode: evMode });
      }
      if (st.type === "end" && isToday(st.start_time, today)) {
        contextStops.push({ ...st, mode: evMode });
      }''',
          )
          replace(
              "src/app/(app)/today/page.tsx",
              '''  allStops.sort(
    (a, b) =>
      (a.start_time ? new Date(a.start_time).getTime() : Infinity) -
      (b.start_time ? new Date(b.start_time).getTime() : Infinity),
  );''',
              '''  allStops.sort(
    (a, b) =>
      (a.start_time ? new Date(a.start_time).getTime() : Infinity) -
      (b.start_time ? new Date(b.start_time).getTime() : Infinity),
  );
  const spineStops = [...allStops, ...contextStops].sort(
    (a, b) =>
      (a.start_time ? new Date(a.start_time).getTime() : Infinity) -
      (b.start_time ? new Date(b.start_time).getTime() : Infinity),
  );''',
          )
          replace(
              "src/app/(app)/today/page.tsx",
              "  const spineAnchors: SpineAnchor[] = allStops.map((s) => {",
              "  const spineAnchors: SpineAnchor[] = spineStops.map((s) => {",
          )
          replace(
              "src/app/(app)/today/page.tsx",
              "      pass: legCardByOriginId.get(s.id) ?? null,\n    };",
              "      pass: legCardByOriginId.get(s.id) ?? null,\n      contextOnly: s.type === \"end\",\n    };",
          )

          # Plan renders the base-to-first and last-to-base transitions while keeping the
          # base bookends out of the anchor list.
          replace(
              "src/app/(app)/plan/[id]/page.tsx",
              "  const nowMs = Date.now();",
              '''  let leadingLeg: SpineNode["after"] = null;
  if (units.length > 0) {
    const firstUnit = units[0];
    const startBookend = stops.find((s) => s.type === "start");
    if (startBookend) {
      const toStop = stopById.get(firstUnit.entryId);
      const tr = transByPair.get(`${startBookend.id}->${firstUnit.entryId}`);
      if (tr && toStop) {
        leadingLeg = { kind: "leg", leg: legOf(tr, startBookend, toStop), transitionId: tr.id, itineraryId: id, fromStopId: startBookend.id, toStopId: firstUnit.entryId };
      }
    }

    const lastUnit = units[units.length - 1];
    const endBookend = [...stops].reverse().find((s) => s.type === "end");
    const lastNode = nodes[nodes.length - 1];
    if (lastUnit && endBookend && lastNode && !lastNode.after) {
      const fromStop = stopById.get(lastUnit.exitId);
      const tr = transByPair.get(`${lastUnit.exitId}->${endBookend.id}`);
      if (tr && fromStop) {
        lastNode.after = { kind: "leg", leg: legOf(tr, fromStop, endBookend), transitionId: tr.id, itineraryId: id, fromStopId: lastUnit.exitId, toStopId: endBookend.id };
      }
    }
  }

  const nowMs = Date.now();''',
          )
          replace(
              "src/app/(app)/plan/[id]/page.tsx",
              "<PlanSpine nodes={nodes}",
              "<PlanSpine leading={leadingLeg} nodes={nodes}",
          )

          # PlanSpine gets a connector-only leading leg, rendered before the first anchor.
          replace(
              "src/components/plan/plan-spine.tsx",
              "export function PlanSpine({\n  nodes,",
              "export function PlanSpine({\n  leading,\n  nodes,",
          )
          replace(
              "src/components/plan/plan-spine.tsx",
              "}: {\n  nodes: SpineNode[];",
              "}: {\n  leading?: SpineNode[\"after\"];\n  nodes: SpineNode[];",
          )
          replace(
              "src/components/plan/plan-spine.tsx",
              '''        <span className="cc-spine-rail" />
        {nodes.map((n) => (''',
              '''        <span className="cc-spine-rail" />
        {leading?.kind === "leg" ? (
          <div className="cc-node">
            <div className="cc-node-dot"><span className="cc-dot-leg" /></div>
            <div>
              <LegCard
                leg={leading.leg}
                onCompare={() => setCompare({
                  transitionId: leading.transitionId,
                  itineraryId: leading.itineraryId,
                  fromStopId: leading.fromStopId,
                  toStopId: leading.toStopId,
                  title: leading.leg.toLabel ?? "first leg",
                })}
              />
            </div>
          </div>
        ) : leading?.kind === "gap" ? (
          <div className="cc-node">
            <div className="cc-node-dot"><span className="cc-dot-gap" /></div>
            <div>
              <GapCard
                gap={leading.gap}
                onResolve={() => setCompare({
                  itineraryId: leading.itineraryId,
                  fromStopId: leading.fromStopId,
                  toStopId: leading.toStopId,
                  title: leading.gap.toLabel ?? "first leg",
                })}
              />
            </div>
          </div>
        ) : null}
        {nodes.map((n) => (''',
          )
          PY

      - name: Verify build
        run: |
          npm ci
          npm run build

      - name: Commit hotfix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "Khonsera Agent"
          git config user.email "actions@users.noreply.github.com"
          git add src .github/workflows/agent-plan-base-leg-hotfix.yml
          git commit -m "Restore base travel legs and repair Plan loading [hotfix-applied]"
          git push origin HEAD:agent/travel-day-leave-by-mvp
