version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    groups:
      observability-and-testing:
        patterns:
          - "@sentry/*"
          - "posthog-js"
          - "@vercel/*"
          - "@playwright/*"
          - "@axe-core/*"
          - "@lhci/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
