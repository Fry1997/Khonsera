<!-- @dsCard group="Planner App" viewport="880x720" name="Planner — active travel day" subtitle="The full place-based day spine: now-hero, tickets, wayfinding, gaps, changeovers" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khonsera · Planner — Active Day</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  html, body { margin: 0; }
  body { min-height: 100vh; padding: 50px 24px 60px; }

  /* recessive demo chrome */
  .controls {
    position: fixed; top: 0; left: 0; right: 0; z-index: 40;
    display: flex; align-items: center; gap: 12px; padding: 11px 22px;
    background: rgba(233,228,218,0.78);
    backdrop-filter: blur(20px) saturate(1.3);
    border-bottom: 1px solid var(--line-soft);
  }
  .controls .brand { display: flex; align-items: center; gap: 9px; font-size: 12.5px;
    font-weight: 600; letter-spacing: 0.02em; }
  .controls .brand .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold);
    box-shadow: 0 0 0 3px var(--gold-tint); }
  .controls .brand em { color: var(--ink-faint); font-weight: 400; font-style: normal; letter-spacing: 0; }
  .controls .scenarios { display: flex; gap: 5px; margin-left: auto; flex-wrap: wrap; justify-content: flex-end; }
  .controls .scn {
    font: 500 11.5px/1 var(--sans); letter-spacing: 0.01em;
    padding: 7px 12px; border-radius: 999px; border: 1px solid transparent;
    background: transparent; color: var(--ink-dim); cursor: pointer; transition: all .18s ease;
  }
  .controls .scn:hover { color: var(--ink); background: rgba(36,30,22,0.05); }
  .controls .scn.on { color: var(--ink); background: var(--widget); box-shadow: var(--lift-sm); }

  /* the device */
  .phone { width: 394px; margin: 0 auto; position: relative; }
  .screen {
    position: relative; background: var(--screen);
    border: 1px solid rgba(36,30,22,0.08); border-radius: 46px;
    box-shadow:
      0 1px 0 1px rgba(255,255,255,0.5) inset,
      0 2px 8px var(--sh-1),
      0 22px 44px -16px var(--sh-3),
      0 60px 96px -40px rgba(54,44,30,0.26);
    overflow: hidden; height: 852px; display: flex; flex-direction: column;
  }

  /* status bar */
  .statusbar { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 15px 30px 6px; }
  .statusbar .t { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  .statusbar .i { display: flex; align-items: center; gap: 7px; opacity: 0.9; }
</style>
</head>
<body>
  <div class="controls">
    <div class="brand"><span class="dot"></span>Khonsera <em>· Active-day planner</em></div>
    <div class="scenarios" id="scenarios"></div>
  </div>

  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="planner-v4.js"></script>
  <script type="text/babel" src="planner-v7-icons.jsx"></script>
  <script type="text/babel" src="planner-v7.jsx"></script>
  <script type="text/babel" src="planner-v7-app.jsx"></script>
</body>
</html>
