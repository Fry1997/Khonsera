<!-- @dsCard group="Components" viewport="700x300" name="Artefacts — wayfinding · status · ticket stub" subtitle="The travel pieces: charcoal number cells, feasibility/lifecycle pills, boarding-pass read-outs, the perforation" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 26px; background: var(--ground); }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
  .label { font-family: var(--mono); font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-faint); width: 100%; margin-bottom: -4px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { WayfindBadge, StatePill, StubField, Perforation, PaperCard, Icon } = window.DesignSystem_486fd8;
    function Demo() {
      return (
        <div style={{ display: 'flex', gap: 26, alignItems: 'flex-start', flexWrap: 'wrap' }}>
          <div style={{ flex: '1 1 300px' }}>
            <div className="row"><span className="label">Wayfinding badges</span>
              <WayfindBadge>4</WayfindBadge>
              <WayfindBadge>12C</WayfindBadge>
              <WayfindBadge>B</WayfindBadge>
              <WayfindBadge tone="soft">Gate 22</WayfindBadge>
            </div>
            <div className="row"><span className="label">State pills</span>
              <StatePill state="comfortable" />
              <StatePill state="tight" />
              <StatePill state="risky" />
              <StatePill state="live" />
            </div>
            <div className="row"><span className="label">State pills · solid + lifecycle</span>
              <StatePill state="risky" solid>Connection missed</StatePill>
              <StatePill state="booked" />
              <StatePill state="done" />
            </div>
          </div>

          {/* a mini ticket stub assembled from the atoms */}
          <PaperCard padding={0} style={{ width: 230, overflow: 'hidden' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 9, padding: '10px 14px', background: 'var(--char)', color: 'var(--cream)' }}>
              <Icon name="train" size={14} />
              <span className="eyb" style={{ fontSize: 9, letterSpacing: '0.22em' }}>RAIL</span>
              <span style={{ marginLeft: 'auto', fontSize: 10.5, color: 'rgba(243,239,230,0.6)' }}>East Midlands</span>
            </div>
            <div style={{ display: 'flex', justifyContent: 'space-between', padding: '16px 16px 12px' }}>
              <div><div style={{ fontSize: 32, fontWeight: 300, color: 'var(--ink)', lineHeight: 0.9 }}>WEL</div><div style={{ fontSize: 10.5, color: 'var(--ink-dim)', marginTop: 5 }}>Wellingborough</div></div>
              <div style={{ paddingTop: 8, color: 'var(--ink-faint)' }}><Icon name="arrowRight" size={16} /></div>
              <div style={{ textAlign: 'right' }}><div style={{ fontSize: 32, fontWeight: 300, color: 'var(--ink)', lineHeight: 0.9 }}>LUT</div><div style={{ fontSize: 10.5, color: 'var(--ink-dim)', marginTop: 5 }}>Luton</div></div>
            </div>
            <Perforation notchBg="var(--ground)" />
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 8, padding: '13px 16px 16px' }}>
              <StubField label="Depart" value="11:32" />
              <StubField label="Platform" value="4" badge />
              <StubField label="Seat" value="22A" badge />
            </div>
          </PaperCard>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>
</html>
