<!-- @dsCard group="Type" viewport="700x210" name="Mono — codes, times, wayfinding" subtitle="JetBrains Mono, tabular. The technical layer: serials, clocks, eyebrows, the operational numbers" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 26px; background: var(--widget); }
  .spec { display: flex; align-items: center; gap: 16px; padding: 9px 0; border-bottom: 1px solid var(--line-soft); }
  .tag { font-family: var(--mono); font-size: 9px; color: var(--ink-faint); width: 90px; flex: none; letter-spacing: 0.06em; }
  .badge { display: inline-flex; align-items: center; justify-content: center; min-width: 26px; height: 24px; padding: 0 8px; border-radius: 7px; background: var(--char); color: var(--cream); font-family: var(--mono); font-size: 12.5px; font-weight: 600; }
</style></head>
<body>
  <div class="spec"><span class="tag">clock</span><span class="mono engr" style="font-size:32px;font-weight:300;color:var(--ink)">11:32</span></div>
  <div class="spec"><span class="tag">serial</span><span class="mono" style="font-size:14px;color:var(--ink-2);letter-spacing:0.04em">KH-4XQ2 · EMR-8461</span></div>
  <div class="spec"><span class="tag">eyebrow</span><span class="eyebrow">TUE 17 JUN · PLAN</span></div>
  <div class="spec"><span class="tag">wayfinding</span><span class="badge">4</span><span class="badge">12C</span><span class="badge">B22</span></div>
</body></html>
