<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px; background: var(--ground); }
  .row { display: flex; gap: 12px; }
  .plate { flex: 1; height: 120px; border-radius: 14px; padding: 14px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; }
  .name { font-family: var(--mono); font-size: 10.5px; }
</style></head>
<body>
  <div class="row">
    <div class="plate pg-d" style="background:var(--char)">
      <span class="eyb" style="font-size:9px;color:var(--cream-dim)">CHARCOAL · --char</span>
      <span class="mono engr-deep" style="font-size:30px;color:var(--cream)">PLAT 4</span>
      <span class="name" style="color:var(--cream-faint)">--cream on --char</span>
    </div>
    <div class="plate pg-d" style="background:var(--char-2)">
      <span class="eyb" style="font-size:9px;color:var(--cream-dim)">--char-2</span>
      <span class="mono engr-d" style="font-size:18px;color:var(--cream-dim)">06:40 → LUT</span>
      <span class="name" style="color:var(--cream-faint)">secondary plate</span>
    </div>
  </div>
</body></html>
