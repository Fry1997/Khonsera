<!-- @dsCard group="Material" viewport="700x180" name="Letterpress & tooth" subtitle="Text debossed into the stock (.engr / .engr-deep) and the dry fibre tooth on the card face" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 26px; background: var(--ground); display: flex; gap: 18px; }
  .demo { flex: 1; display: flex; align-items: center; justify-content: center; height: 110px; border-radius: 14px; }
  .lbl { font-family: var(--mono); font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-faint); }
</style></head>
<body>
  <div style="flex:1">
    <div class="demo pg" style="background:var(--widget);box-shadow:var(--lift);border:1px solid var(--line)">
      <span class="mono engr" style="font-size:42px;font-weight:300;color:var(--ink)">06:10</span>
    </div>
    <div class="lbl" style="margin-top:9px">.engr on light stock</div>
  </div>
  <div style="flex:1">
    <div class="demo pg-d" style="background:var(--char)">
      <span class="mono engr-deep" style="font-size:42px;font-weight:400;color:var(--cream)">06:40</span>
    </div>
    <div class="lbl" style="margin-top:9px">.engr-deep on charcoal — note the screen-blend tooth</div>
  </div>
</body></html>
