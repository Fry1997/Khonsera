<!-- @dsCard group="Material" viewport="700x170" name="Corner family & perforation" subtitle="Crisp business-card geometry: hero 18 · tile 14 · inner 11 · chip 9 · badge 7. Plus the ticket cut." -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--ground); display: flex; align-items: center; gap: 16px; }
  .box { background: var(--widget); box-shadow: var(--lift-sm); border: 1px solid var(--line); display: grid; place-items: end center; }
  .n { font-family: var(--mono); font-size: 9px; color: var(--ink-faint); padding-bottom: 6px; }
  .ticket { width: 150px; background: var(--widget); box-shadow: var(--lift); border-radius: 14px; overflow: hidden; }
</style></head>
<body>
  <div class="box" style="width:70px;height:70px;border-radius:18px"><span class="n">18</span></div>
  <div class="box" style="width:62px;height:62px;border-radius:14px"><span class="n">14</span></div>
  <div class="box" style="width:54px;height:54px;border-radius:11px"><span class="n">11</span></div>
  <div class="box" style="width:46px;height:46px;border-radius:9px"><span class="n">9</span></div>
  <div class="box" style="width:38px;height:38px;border-radius:7px"><span class="n">7</span></div>
  <div class="ticket pg">
    <div style="height:34px;background:var(--char)"></div>
    <div class="perf" style="margin:0 0"></div>
    <div style="height:42px"></div>
  </div>
</body></html>
