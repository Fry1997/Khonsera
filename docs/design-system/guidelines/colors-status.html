<!-- @dsCard group="Colors" viewport="700x200" name="Status & salts" subtitle="Feasibility families (sage/amber/rust), cool foil (slate), and the rare salts (terra/plum) — one per composition" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px; background: var(--widget); }
  .grp { margin-bottom: 14px; }
  .lbl { font-family: var(--mono); font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 8px; }
  .row { display: flex; gap: 10px; }
  .pair { display: flex; align-items: center; gap: 8px; padding: 7px 12px 7px 8px; border-radius: 9px; }
  .dot { width: 14px; height: 14px; border-radius: 5px; }
  .nm { font-family: var(--mono); font-size: 10.5px; }
</style></head>
<body>
  <div class="grp">
    <div class="lbl">Feasibility — comfortable · tight · risky</div>
    <div class="row">
      <span class="pair" style="background:var(--sage-soft)"><span class="dot" style="background:var(--sage)"></span><span class="nm" style="color:var(--sage)">--sage</span></span>
      <span class="pair" style="background:var(--amber-soft)"><span class="dot" style="background:var(--amber)"></span><span class="nm" style="color:var(--amber)">--amber</span></span>
      <span class="pair" style="background:var(--rust-soft)"><span class="dot" style="background:var(--rust)"></span><span class="nm" style="color:var(--rust)">--rust</span></span>
    </div>
  </div>
  <div class="grp">
    <div class="lbl">Cool foil + rare salts — one per composition, never terra + plum together</div>
    <div class="row">
      <span class="pair" style="background:var(--slate-soft)"><span class="dot" style="background:var(--slate)"></span><span class="nm" style="color:var(--slate-2)">--slate</span></span>
      <span class="pair" style="background:var(--gold-tint)"><span class="dot" style="background:var(--terra)"></span><span class="nm" style="color:var(--terra-2)">--terra</span></span>
      <span class="pair" style="background:var(--plum-soft)"><span class="dot" style="background:var(--plum)"></span><span class="nm" style="color:var(--plum)">--plum</span></span>
    </div>
  </div>
</body></html>
