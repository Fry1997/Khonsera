<!-- @dsCard group="Brand" viewport="700x200" name="Wordmark" subtitle="Satoshi 300 light, uppercase, +0.26em tracking. Monocolour ink — the emblem dot is the only gold." -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 30px; background: var(--ground); display: flex; flex-direction: column; gap: 22px; }
  .lockup { display: inline-flex; align-items: center; gap: 12px; }
  .dot { width: 11px; height: 11px; border-radius: 999px; background: var(--gold); box-shadow: 0 0 0 4px var(--gold-tint); flex: none; }
  .wm { font-family: var(--display); font-weight: 300; text-transform: uppercase; color: var(--ink); padding-left: 0.26em; }
</style></head>
<body>
  <div class="lockup"><span class="dot"></span><span class="wm" style="font-size:40px;letter-spacing:0.26em">KHONSERA</span></div>
  <div style="display:flex;align-items:center;gap:28px">
    <div class="lockup"><span class="dot" style="width:7px;height:7px;box-shadow:0 0 0 3px var(--gold-tint)"></span><span class="wm" style="font-size:18px;letter-spacing:0.2em">KHONSERA</span></div>
    <span style="font-family:var(--mono);font-size:10px;color:var(--ink-faint)">app lockup · 18px</span>
  </div>
</body></html>
